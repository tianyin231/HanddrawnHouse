<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小院 · 装修尺寸与方案复核</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/viewer/design-review.css"></head>
<body><header><a href="/">← 返回三维小院</a><strong>装修尺寸与方案复核</strong><a href="/?walk=1">第一人称探索 ↗</a><span>模型方案 · 待实测</span></header>
<main><section class="drawing-pane" aria-label="装修平面图">
  <div class="drawing-tools"><label>楼层 <select id="plan-floor"><option value="1">一层</option><option value="2">二层</option></select></label><label>布置 <select id="plan-mode"><option value="furnished">装修后</option><option value="empty">建筑空房</option></select></label><label><input id="plan-dimensions" type="checkbox" checked>尺寸</label><label><input id="plan-zones" type="checkbox">使用范围</label><label><input id="plan-services" type="checkbox">候选接点</label><label><input id="plan-equipment" type="checkbox">灯具与设备</label></div>
  <div class="drawing-actions"><button id="plan-overview">整层</button><button id="plan-zoom">放大所选房间</button><button id="plan-export">下载 SVG 图</button><button id="plan-print">打印图纸</button></div>
  <p id="building-drawing-hint" class="note" hidden>节点关系图不按比例；小屏可在图内左右滑动。</p>
  <div id="drawing" aria-live="polite">正在读取同一套平面与家具数据…</div>
</section>
<aside><nav aria-label="复核内容"><button data-panel="room" aria-pressed="true">房间</button><button data-panel="equipment" aria-pressed="false">设备与管线</button><button data-panel="building" aria-pressed="false">建筑节点</button><button data-panel="materials" aria-pressed="false">材料用量</button><button data-panel="pending" aria-pressed="false">待确认</button></nav>
  <section id="panel-room"><label for="review-room">选择房间</label><select id="review-room"></select><h1 id="review-room-name"></h1><p id="review-room-size"></p><p class="note">图中尺寸随当前模型计算，没有写入或替代现场记录。</p><div id="review-room-details"></div></section>
  <section id="panel-materials" hidden><h1>候选材料与方案用量</h1><p class="note">只统计模型已表达的范围，不含损耗、不计算价格。采购数量还需排版、包装和现场尺寸。</p><div id="review-materials"></div><button id="review-export">导出复核清单 JSON</button></section>
  <section id="panel-equipment" hidden><h1>设备占位与连接关系</h1><p class="note">蓝框是候选机位，箭头是拟送风方向，橙色虚线止于待核穿墙处。管径、回路与室外终点未定。</p><div id="review-equipment"></div><button id="equipment-export">导出含设备的复核 JSON</button></section>
  <section id="panel-building" hidden><label for="building-detail">选择构造关系</label><select id="building-detail"></select><label class="building-toggle"><input id="building-candidate" type="checkbox" checked>显示候选防水与排水关系</label><div id="review-building"></div><button id="building-export">导出含节点的复核 JSON</button></section>
  <section id="panel-pending" hidden><h1>需要确认的条件</h1><p class="note">“已建模”与“现场已确认”分别记录。这里不提供一键全部确认。</p><div id="review-pending"></div><a href="/viewer/survey.html">打开现场复测记录工具</a></section>
</aside></main><p id="review-error" role="alert" hidden></p><script type="module" src="/viewer/design-review.js"></script></body></html>
